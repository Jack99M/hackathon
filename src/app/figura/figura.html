<div style="margin-bottom: 15px;">
  <button (click)="agrandar()">Agrandar</button>
  <button (click)="achicar()">Achicar</button>
</div>

<ko-stage [config]="configStage">
  <ko-layer>

    <ko-line [config]="configCaraSuperior"></ko-line>

    <ko-line [config]="configCaraFrontal"></ko-line>

    <ko-line [config]="configCaraLateral"></ko-line>

    <ko-line [config]="configCaraSuperior()"></ko-line>
    <ko-line [config]="configCaraFrontal()"></ko-line>
    <ko-line [config]="configCaraLateral()"></ko-line>
  </ko-layer>
</ko-stage>
